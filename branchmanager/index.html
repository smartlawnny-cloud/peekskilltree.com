<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Branch Manager moved → branchmanager.app</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://branchmanager.app/">
<script>
// Preserve full path/query/hash. We're at /branchmanager/<rest>; strip leading
// /branchmanager and forward to branchmanager.app.
(function(){
  var p = location.pathname.replace(/^\/branchmanager\/?/, '/');
  location.replace('https://branchmanager.app' + p + location.search + location.hash);
})();
</script>
<meta http-equiv="refresh" content="0; url=https://branchmanager.app/">
<style>body{font:16px/1.5 system-ui;color:#1a3c12;padding:40px;text-align:center}</style>
</head>
<body>
<p>Branch Manager has moved to <a href="https://branchmanager.app/">branchmanager.app</a>.</p>
<p>Redirecting…</p>
</body>
</html>
