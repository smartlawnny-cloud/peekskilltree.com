<style>
  :root {
    --green-dark: #285a3a;
    --green: #347a4a;
    --green-light: #5cb176;
    --green-bg: #edf7f0;
    --white: #ffffff;
    --bg: #f3f4f6;
    --text: #212529;
    --text-light: #6b7280;
    --border: #e5e7eb;
    --red: #dc3545;
    --orange: #f59e0b;
    --blue: #3b82f6;
    --sidebar-w: 220px;
    --accent: #16a34a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; font-size:14px; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  /* ── Layout ── */
  .app { display:flex; height:100vh; }

  /* ── Sidebar (Jobber style) ── */
  .sidebar {
    width:var(--sidebar-w); background:#1e293b; color:var(--white);
    display:flex; flex-direction:column; flex-shrink:0;
    transition: transform 0.25s ease;
    z-index:100;
  }
  .sidebar-header {
    padding:16px 14px 14px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .sidebar-header h1 {
    font-size:16px; font-weight:700;
  }
  .sidebar-header h1 span { display:block; font-size:10px; font-weight:400; opacity:.5; margin-top:2px; }
  .sidebar-user {
    padding:10px 14px; font-size:12px; opacity:.7; border-bottom:1px solid rgba(255,255,255,.08);
  }

  .sidebar-nav { flex:1; padding:6px 0; overflow-y:auto; }
  .nav-section { padding:14px 14px 4px; font-size:10px; text-transform:uppercase; letter-spacing:.1em; opacity:.35; font-weight:700; }
  .nav-item {
    display:flex; align-items:center; gap:10px; padding:8px 14px;
    font-size:13px; color:rgba(255,255,255,.7); cursor:pointer;
    transition: all 0.12s; text-decoration:none; border:none; background:none; width:100%;
    border-left:3px solid transparent;
  }
  .nav-item:hover { background:rgba(255,255,255,.06); color:#fff; }
  .nav-item.active { background:rgba(255,255,255,.1); color:#fff; font-weight:600; border-left-color:#16a34a; }
  .nav-item .icon { width:18px; text-align:center; font-size:14px; }
  .nav-item .badge { margin-left:auto; background:#dc3545; color:#fff; font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; min-width:18px; text-align:center; }

  .sidebar-footer {
    padding:10px 14px; border-top:1px solid rgba(255,255,255,.08);
    font-size:10px; opacity:.4;
  }

  /* ── Main Content (Jobber style) ── */
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 24px; background:var(--white); border-bottom:1px solid var(--border);
    min-height:52px;
  }
  .topbar h2 { font-size:22px; font-weight:700; letter-spacing:-.02em; }
  .topbar-actions { display:flex; gap:8px; align-items:center; }

  .btn {
    display:inline-flex; align-items:center; gap:6px;
    padding:8px 16px; border-radius:6px; font-size:13px; font-weight:600;
    cursor:pointer; border:none; transition:all .12s; text-decoration:none;
  }
  .btn-primary { background:#16a34a; color:var(--white); }
  .btn-primary:hover { background:#15803d; }
  .btn-outline { background:var(--white); color:var(--text); border:1px solid var(--border); }
  .btn-outline:hover { background:var(--bg); border-color:#9ca3af; }
  .btn-danger { background:#dc3545; color:#fff; }

  .content { flex:1; overflow-y:auto; padding:24px; }

  /* ── Mobile hamburger ── */
  .hamburger {
    display:none; background:none; border:none; color:var(--text); font-size:24px;
    cursor:pointer; padding:4px;
  }
  .sidebar-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:99;
  }

  /* ── Dashboard Cards (Jobber style) ── */
  .stat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px; margin-bottom:20px; }
  .stat-card {
    background:var(--white); border-radius:8px; padding:16px 18px;
    border:1px solid var(--border); position:relative;
    transition: box-shadow .15s;
  }
  .stat-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.06); }
  .stat-card .stat-label { font-size:11px; color:var(--text-light); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; font-weight:600; }
  .stat-card .stat-value { font-size:26px; font-weight:800; color:var(--text); }
  .stat-card .stat-sub { font-size:12px; color:var(--text-light); margin-top:2px; }
  .stat-card .stat-trend { font-size:11px; font-weight:700; }
  .stat-card .stat-trend.up { color:#16a34a; }
  .stat-card .stat-trend.down { color:var(--red); }

  /* ── Tables (Jobber style) ── */
  .data-table { width:100%; border-collapse:collapse; background:var(--white); border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .data-table th { background:#f9fafb; padding:8px 16px; text-align:left; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--text-light); border-bottom:1px solid var(--border); }
  .data-table td { padding:10px 16px; font-size:13px; border-bottom:1px solid #f3f4f6; }
  .data-table tr:hover { background:#f9fafb; cursor:pointer; }
  .data-table tr:last-child td { border:none; }

  /* ── Status Badges (Jobber colors) ── */
  .status-badge {
    display:inline-block; padding:2px 10px; border-radius:12px;
    font-size:11px; font-weight:600; letter-spacing:.01em;
  }
  .status-active { background:#dcfce7; color:#166534; }
  .status-lead { background:#dbeafe; color:#1e40af; }
  .status-late { background:#fee2e2; color:#991b1b; }
  .status-paid { background:#dcfce7; color:#166534; }
  .status-draft { background:#f3f4f6; color:#6b7280; }
  .status-sent { background:#fef3c7; color:#92400e; }
  .status-new { background:#dbeafe; color:#1e40af; }
  .status-completed { background:#dcfce7; color:#166534; }
  .status-scheduled { background:#e0e7ff; color:#3730a3; }
  .status-in_progress, .status-in-progress { background:#fef3c7; color:#92400e; }
  .status-awaiting, .status-awaiting_response, .status-awaiting_payment { background:#fef3c7; color:#92400e; }
  .status-approved, .status-converted { background:#dcfce7; color:#166534; }
  .status-declined, .status-cancelled, .status-past_due, .status-overdue { background:#fee2e2; color:#991b1b; }
  .status-archived, .status-inactive { background:#f3f4f6; color:#6b7280; }

  /* ── Filter Buttons ── */
  .filter-btn {
    padding:6px 14px; border-radius:6px; font-size:12px; font-weight:600;
    border:1px solid var(--border); background:var(--white); color:var(--text-light);
    cursor:pointer; transition:all .12s;
  }
  .filter-btn:hover { border-color:#9ca3af; color:var(--text); }
  .filter-btn.active, .filter-btn[style*="background:var(--green-dark)"] { background:#16a34a !important; color:#fff !important; border-color:#16a34a !important; }

  /* ── Search (Jobber style) ── */
  .search-box {
    display:flex; align-items:center; gap:8px; padding:7px 12px;
    background:#f9fafb; border:1px solid var(--border); border-radius:6px;
    font-size:13px; min-width:240px;
  }
  .search-box:focus-within { border-color:#16a34a; box-shadow:0 0 0 2px rgba(22,163,74,.15); }
  .search-box input { border:none; background:none; outline:none; flex:1; font-size:13px; }

  /* ── Empty state ── */
  .empty-state { text-align:center; padding:48px 20px; color:var(--text-light); }
  .empty-state .empty-icon { font-size:40px; margin-bottom:10px; }
  .empty-state h3 { font-size:16px; color:var(--text); margin-bottom:6px; font-weight:600; }
  .empty-state p { font-size:13px; max-width:380px; margin:0 auto; }

  /* ── Mobile Bottom Nav ── */
  .bottom-nav {
    display:none; position:fixed; bottom:0; left:0; right:0; z-index:150;
    background:var(--white); border-top:1px solid var(--border);
    padding:4px 0 env(safe-area-inset-bottom, 4px);
    box-shadow:0 -2px 12px rgba(0,0,0,.08);
  }
  .bottom-nav-inner {
    display:flex; justify-content:space-around; align-items:center;
  }
  .bottom-nav-btn {
    display:flex; flex-direction:column; align-items:center; gap:2px;
    background:none; border:none; padding:6px 12px; cursor:pointer;
    font-size:10px; color:var(--text-light); font-weight:600;
    transition:color .15s;
  }
  .bottom-nav-btn.active { color:var(--green-dark); }
  .bottom-nav-btn .bnav-icon { font-size:20px; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); }
    .sidebar.open { transform:translateX(0); }
    .sidebar-overlay.open { display:block; }
    .hamburger { display:block; }
    .stat-grid { grid-template-columns:1fr 1fr; }
    .content { padding:16px; padding-bottom:80px; }
    .topbar { padding:12px 16px; }
    .search-box { min-width:auto; flex:1; }
    .bottom-nav { display:block; }
  }
  @media (max-width: 480px) {
    .stat-grid { grid-template-columns:1fr; }
  }

  /* ── Modals ── */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; transition:opacity .2s;
  }
  .modal-overlay.open { opacity:1; }
  .modal {
    background:var(--white); border-radius:16px; max-width:560px; width:100%;
    max-height:85vh; display:flex; flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    transform:translateY(20px); transition:transform .2s;
  }
  .modal-overlay.open .modal { transform:translateY(0); }
  .modal.modal-wide { max-width:800px; }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .modal-header h3 { font-size:18px; font-weight:700; }
  .modal-close { background:none; border:none; font-size:28px; cursor:pointer; color:var(--text-light); line-height:1; padding:0 4px; }
  .modal-body { padding:20px; overflow-y:auto; flex:1; }
  .modal-footer {
    display:flex; align-items:center; justify-content:flex-end; gap:8px;
    padding:12px 20px; border-top:1px solid var(--border);
  }

  /* ── Forms ── */
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:13px; font-weight:600; color:var(--text); margin-bottom:4px; }
  .form-group input, .form-group select, .form-group textarea {
    width:100%; padding:9px 12px; border:2px solid var(--border); border-radius:8px;
    font-size:14px; font-family:inherit; background:var(--white); color:var(--text);
    transition:border-color .15s;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    outline:none; border-color:var(--green-light);
  }
  .form-group textarea { resize:vertical; }

  /* ── Toast ── */
  .toast {
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(100px);
    padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600;
    z-index:300; transition:transform .3s; box-shadow:0 4px 20px rgba(0,0,0,.2);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast-success { background:var(--green-dark); color:var(--white); }
  .toast-error { background:var(--red); color:var(--white); }

  /* ── Filter buttons ── */
  .client-filter.active { background:var(--green-dark) !important; color:var(--white) !important; border-color:var(--green-dark) !important; }
</style>
</head>

<script>
// ── Navigation ──
var currentPage = 'dashboard';
document.querySelectorAll('.nav-item').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var page = this.dataset.page;
    if (page === currentPage) return;
    currentPage = page;
    document.querySelectorAll('.nav-item').forEach(function(b) { b.classList.remove('active'); });
    this.classList.add('active');
    loadPage(page);
    if (window.innerWidth <= 768) toggleSidebar();
  });
});

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
}

// ── Auth Gate ──
function checkAuth() {
  if (!Auth.isLoggedIn()) {
    var appEl = document.querySelector('.app');
    var bottomNav = document.querySelector('.bottom-nav');
    if (appEl) appEl.style.display = 'none';
    if (bottomNav) bottomNav.style.display = 'none';
    var loginDiv = document.getElementById('login-screen');
    if (!loginDiv) {
      loginDiv = document.createElement('div');
      loginDiv.id = 'login-screen';
      document.body.insertBefore(loginDiv, document.body.firstChild);
    }
    loginDiv.innerHTML = Auth.renderLogin();
    return false;
  }
  var appEl = document.querySelector('.app');
  if (appEl) appEl.style.display = '';
  var loginDiv = document.getElementById('login-screen');
  if (loginDiv) loginDiv.innerHTML = '';

  // Update sidebar user info
  var userEl = document.querySelector('.sidebar-user');
  if (userEl) userEl.innerHTML = Auth.user.name + ' <span style="opacity:.6;">· ' + Auth.role.replace(/_/g, ' ') + '</span>';

  // Hide nav items user can't access
  document.querySelectorAll('.nav-item[data-page]').forEach(function(btn) {
    var page = btn.dataset.page;
    btn.style.display = Auth.canAccess(page) ? '' : 'none';
  });

  return true;
}

function loadPage(page) {
  if (!checkAuth()) return;
  if (!Auth.canAccess(page)) { page = 'dashboard'; }
  var config = pageConfigs[page] || { title: page, action: null };
  document.getElementById('pageTitle').textContent = config.title;
  var actionBtn = document.getElementById('pageAction');
  if (config.action) {
    actionBtn.textContent = config.action;
    actionBtn.style.display = '';
    actionBtn.onclick = config.actionFn ? new Function(config.actionFn) : null;
  } else {
    actionBtn.style.display = 'none';
  }

  // Update badges
  var newReqs = DB.requests.countNew();
  document.getElementById('badge-requests').textContent = newReqs > 0 ? newReqs : '';
  document.getElementById('badge-clients').textContent = '';

  var content = document.getElementById('pageContent');
  var renderer = pageRenderers[page];
  if (renderer) {
    content.innerHTML = renderer();
  } else {
    content.innerHTML = '<div class="empty-state"><div class="empty-icon">🚧</div><h3>Coming Soon</h3><p>' + config.title + ' — building next.</p></div>';
  }
}

// ── Global Search ──
var searchTimeout;
document.getElementById('globalSearch').addEventListener('input', function() {
  var q = this.value.trim();
  clearTimeout(searchTimeout);
  if (!q || q.length < 2) {
    if (currentPage === 'search') loadPage('dashboard');
    return;
  }
  searchTimeout = setTimeout(function() {
    currentPage = 'search';
    document.querySelectorAll('.nav-item').forEach(function(b) { b.classList.remove('active'); });
    document.getElementById('pageTitle').textContent = 'Search';
    document.getElementById('pageAction').style.display = 'none';
    document.getElementById('pageContent').innerHTML = SearchPage.render(q);
  }, 300);
});
document.getElementById('globalSearch').addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { this.value = ''; loadPage('dashboard'); }
});
