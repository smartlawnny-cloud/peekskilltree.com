  <text x="200" y="556" font-family="-apple-system,'SF Pro Text',system-ui,sans-serif" font-size="16" font-weight="500" fill="#9ab086" text-anchor="middle" letter-spacing="2">HUDSON VALLEY · BETA</text>

  <text x="1100" y="595" font-family="-apple-system,'SF Pro Text',system-ui,sans-serif" font-size="16" fill="#6e6a62" text-anchor="end">peekskilltree.com/dinner</text>
